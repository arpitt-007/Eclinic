{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="container">
  <div class="card auth-card shadow-sm">
    <div class="card-body p-4 p-md-5">
      <h1 class="h3 fw-bold mb-1">Welcome back</h1>
      <p class="text-muted mb-4">Log in to manage your consultations.</p>
      <form method="post">{% csrf_token %}
        {% include "partials/form.html" %}
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary w-100 py-2">Log in</button>
      </form>
      <p class="text-center text-muted small mt-4 mb-0">
        New here? <a href="{% url 'signup' %}">Create a patient account</a> ·
        <a href="{% url 'signup_doctor' %}">Join as a doctor</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
