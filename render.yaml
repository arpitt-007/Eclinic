# Render Blueprint. In Render: New → Blueprint → pick this repo.
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
databases:
  - name: eclinic-db
    plan: free
    region: singapore
    databaseName: eclinic
    user: eclinic

services:
  - type: web
    name: eclinic
    runtime: python
    plan: free
    region: singapore
    buildCommand: ./build.sh
    startCommand: gunicorn eclinic.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: DATABASE_URL
        fromDatabase:
          name: eclinic-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: SEED_DEMO
        value: "1"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
