# Render Blueprint. In Render: New → Blueprint → pick this repo.
# No external database: a SQLite file is created on each start and filled
# with the accounts defined in clinic/management/commands/seed_demo.py.
services:
  - type: web
    name: eclinic
    runtime: python
    plan: free
    region: singapore
    buildCommand: ./build.sh
    startCommand: python manage.py migrate --no-input && python manage.py seed_demo && gunicorn eclinic.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      # Password for the built-in "admin" account. Render generates it;
      # reveal it under the service's Environment tab.
      - key: ADMIN_PASSWORD
        generateValue: true
